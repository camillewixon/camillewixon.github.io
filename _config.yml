# Basic Site Settings
locale                   : "en-US"
title                    : "Camille Wixon"
name                     : "Camille Wixon"
description              : "PhD Candidate in Economics | Health Economics and Industrial Organization"
url                      : "https://camillewixon.github.io"
repository               : "camillewixon/camillewixon.github.io"
title_separator          : "-"
baseurl                  : ""

# Author Information
author:
  avatar           : "images/profile2.png"
  name             : "Camille Wixon"
  bio              : "PhD Candidate in Economics at the University of Virginia"
  location         : "Charlottesville, VA"
  employer         : "University of Virginia"
  email            : "caw2va@virginia.edu"

  # Academic Profiles (fill later if desired)
  googlescholar    :
  orcid            :

  # Code / GitHub
  github           : "camillewixon"

  # Social (FILL THESE IN when ready)
  linkedin         : "camille-wixon"

# Site Settings
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"

# Comments (disabled)
comments:
  provider               :

# Analytics (leave blank for now)
analytics:
  provider               :
  google:
    tracking_id          :

# Files to include
include:
  - .htaccess
  - _pages
  - files

# Files to exclude
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Gemfile
  - LICENSE
  - README
  - node_modules

# Markdown settings
markdown: kramdown
highlighter: rouge

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Permalinks
permalink: /:categories/:title/

# Timezone (fixed)
timezone: America/New_York

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-sitemap
  - jekyll-feed
